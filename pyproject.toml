[project]
name = "slm-wiki"
version = "0.3.0"
description = "Karpathy-style LLM wiki maintained by local SLMs via llama.cpp, with a local web UI"
readme = "README.md"
authors = [
    { name = "Sourav Verma", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "truststore>=0.10.5",
    "typer>=0.15",
]

[project.scripts]
slm-wiki = "slm_wiki.cli:app"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.8",
]
